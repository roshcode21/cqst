name: CQST build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: cqst-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Eleventy + Pagefind
        run: npm run build

      - name: Verify production build
        run: |
          test -f _site/index.html
          test -f _site/empezar/index.html
          test -f _site/empezar/la-fecha-la-ponemos-despues/index.html
          test -f _site/assets/css/production/base.css
          test -f _site/assets/css/production/home.css
          test -f _site/assets/css/production/cycle.css
          test -f _site/assets/css/production/article.css
          test -f _site/assets/css/production/article-final.css
          test -f _site/assets/js/production/home.js
          test -f _site/assets/js/production/cycle.js
          test -f _site/assets/js/production/article.js
          test -d _site/pagefind

          # Home must contain server-rendered editorial content and no lab-version classes.
          grep -q 'id="main"' _site/index.html
          grep -q 'class="home-hero scene"' _site/index.html
          grep -q 'La fecha la ponemos después' _site/index.html
          grep -q 'https://formspree.io/f/moeqwono' _site/index.html
          grep -q 'application/ld+json' _site/index.html
          ! grep -Eq 'class="[^"]*v(11|15|16|17|18|19|20)' _site/index.html

          # Cycle page must be generated from the editorial system.
          grep -q 'class="cycle-page cycle-page--empezar"' _site/empezar/index.html
          grep -q 'CreativeWorkSeries' _site/empezar/index.html
          grep -q 'CollectionPage' _site/empezar/index.html
          grep -q 'Rodolfo Raudales' _site/empezar/index.html
          grep -q 'Mariví Cerisola' _site/empezar/index.html
          grep -q 'Mel Castán' _site/empezar/index.html

          # Published article must be generated from the clean article system.
          ARTICLE=_site/empezar/la-fecha-la-ponemos-despues/index.html
          grep -q 'class="article-page article-page--empezar"' "$ARTICLE"
          grep -q 'itemtype="https://schema.org/Article"' "$ARTICLE"
          grep -q 'La fecha la ponemos después' "$ARTICLE"
          grep -q 'Digamos que empieza aquí.' "$ARTICLE"
          grep -q 'Efecto de nuevo comienzo' "$ARTICLE"
          grep -q 'data-pagefind-meta="type:article"' "$ARTICLE"
          grep -q '/assets/css/production/article-final.css' "$ARTICLE"
          grep -q '/assets/js/production/article.js' "$ARTICLE"
          ! grep -q '/assets/css/article/' "$ARTICLE"
          ! grep -q 'site-footer.css' "$ARTICLE"

          # Existing public routes stay alive until each one is migrated to src/.
          test -f _site/cqst/index.html
          test -f _site/privacidad/index.html
          test -f _site/temas/index.html
          test -f _site/voces/index.html
          test -f _site/feed.xml
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/site.webmanifest

      - name: Upload built site for QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cqst-site
          path: _site
          if-no-files-found: error
          retention-days: 7
